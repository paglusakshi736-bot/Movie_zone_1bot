<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Zone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adgram.io/sdk.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff0844;
            --primary-gradient: linear-gradient(135deg, #ff0844 0%, #ff4e50 100%);
            --bg-dark: #0a0c10;
            --card-bg: #12161f;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #8b9bb4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* 🔝 BRAND HEADER */
        .app-header {
            padding: 14px 16px;
            background: linear-gradient(180deg, rgba(255,8,68,0.12) 0%, rgba(10,12,16,0) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff0844;
            box-shadow: 0 0 12px rgba(255, 8, 68, 0.4);
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .powered-tag {
            font-size: 0.7rem;
            color: #ff4e50;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .header-stats-badge {
            background: rgba(255, 8, 68, 0.12);
            border: 1px solid rgba(255, 8, 68, 0.35);
            padding: 6px 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            backdrop-filter: blur(8px);
        }

        .header-stats-badge .stats-count {
            font-size: 0.92rem;
            font-weight: 800;
            color: #ff4e50;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-stats-badge .stats-label {
            font-size: 0.62rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        /* 🔗 3 DYNAMIC BUTTONS */
        .quick-links {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 12px 16px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 10px 6px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            transition: 0.2s;
            text-align: center;
        }

        .quick-btn.group { border-color: rgba(0, 136, 204, 0.35); color: #29b6f6; }
        .quick-btn.channel { border-color: rgba(255, 8, 68, 0.35); color: #ff5252; }
        .quick-btn.premium { border-color: rgba(255, 193, 7, 0.35); color: #ffc107; }

        /* 🔍 SEARCH & YEAR */
        .search-wrapper {
            padding: 0 16px 12px;
            display: flex;
            gap: 10px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .search-input {
            width: 100%;
            background: #161b26;
            border: 1px solid var(--card-border);
            padding: 12px 14px 12px 42px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
        }

        .search-input:focus { border-color: #ff0844; }

        .year-select-box {
            position: relative;
            min-width: 110px;
        }

        .year-dropdown {
            width: 100%;
            height: 100%;
            background: #161b26;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #ff4e50;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0 10px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .year-select-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff4e50;
            pointer-events: none;
            font-size: 0.8rem;
        }

        .year-dropdown option {
            background: #141822;
            color: #fff;
            font-weight: 600;
        }

        /* 🏷️ CATEGORY CHIPS */
        .filter-scroll {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }

        .filter-chip {
            background: #161b26;
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-chip.active {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
        }

        /* 🎴 MOVIE CARDS */
        .movies-grid {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        .poster-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #1c2230;
            overflow: hidden;
        }

        .poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .file-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ff0844;
            color: #ff4e50;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        .card-details {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .movie-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
        }

        .get-btn {
            background: var(--primary-gradient);
            border: none;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 8, 68, 0.35);
        }

        /* 📱 BOTTOM SHEET */
        .sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: 0.3s ease;
        }

        .sheet-overlay.active { display: block; opacity: 1; }

        .bottom-sheet {
            position: fixed;
            left: 0; right: 0; bottom: -100%;
            background: #141822;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px 24px 0 0;
            padding: 20px 16px 30px;
            z-index: 101;
            transition: 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 75vh;
            display: flex;
            flex-direction: column;
        }

        .bottom-sheet.active { bottom: 0; }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 14px;
        }

        .sheet-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #fff;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .files-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            background: #1b212f;
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #e1e7f0;
        }

        .dl-action-btn {
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .dl-action-btn:disabled {
            background: #444c5e;
            color: #8b9bb4;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 🔒 JOIN POPUP */
        .join-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 360px;
            background: #161b26;
            border: 1px solid #ff0844;
            border-radius: 20px;
            padding: 24px 20px;
            z-index: 105;
            display: none;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .join-modal.active { display: block; transform: translate(-50%, -50%) scale(1); }
        .join-modal h3 { color: #ff4e50; margin-bottom: 8px; font-size: 1.15rem; }
        .join-modal p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px; }
        .join-link-btn {
            display: block;
            width: 100%;
            background: #29b6f6;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .join-check-btn {
            width: 100%;
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .no-result-box {
            text-align: center;
            padding: 30px 16px;
            background: #161b26;
            border-radius: 16px;
            border: 1px dashed var(--card-border);
            margin: 10px 0;
        }

        .no-result-box i { font-size: 2.2rem; color: #ff4e50; margin-bottom: 10px; }
        .no-result-box h4 { font-size: 1rem; margin-bottom: 6px; }
        .no-result-box p { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 14px; }
        .req-now-btn {
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-container">
            <img src="https://i.ibb.co/23Vn7YBR/1786682242346.png" alt="Movie Zone Logo" class="brand-logo">
            <div class="brand-text">
                <h1>Movie Zone</h1>
                <div class="powered-tag" id="poweredTag">Powered by Admin</div>
            </div>
        </div>
        <div class="header-stats-badge">
            <div class="stats-count" id="headerMovieCount"><i class="fas fa-film"></i> ...</div>
            <div class="stats-label">Total Movies</div>
        </div>
    </header>

    <div class="quick-links">
        <a id="btnDiscussion" href="#" target="_blank" class="quick-btn group">
            <i class="fab fa-telegram-plane"></i> Discussion
        </a>
        <a id="btnBackup" href="#" target="_blank" class="quick-btn channel">
            <i class="fas fa-shield-alt"></i> Backup
        </a>
        <a id="btnPremium" href="#" target="_blank" class="quick-btn premium">
            <i class="fas fa-crown"></i> Premium
        </a>
    </div>

    <div class="search-wrapper">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search movies, web series...">
        </div>
        <div class="year-select-box">
            <select id="yearDropdown" class="year-dropdown" onchange="handleYearChange(this.value)">
                <option value="all">📅 All Years</option>
            </select>
            <i class="fas fa-chevron-down"></i>
        </div>
    </div>

    <div class="filter-scroll">
        <div class="filter-chip active" onclick="applyCategoryFilter('all', this)">All</div>
        <div class="filter-chip" onclick="applyCategoryFilter('Hindi', this)">Hindi Dubbed</div>
        <div class="filter-chip" onclick="applyCategoryFilter('Web Series', this)">Web Series</div>
        <div class="filter-chip" onclick="applyCategoryFilter('South', this)">South Special</div>
        <div class="filter-chip" onclick="applyCategoryFilter('Hollywood', this)">Hollywood</div>
    </div>

    <main class="movies-grid" id="moviesContainer">
        <div class="loader"><i class="fas fa-spinner fa-spin"></i> Loading Movies...</div>
    </main>

    <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="sheetTitle">Movie Title</div>
        <div class="files-list" id="filesList"></div>
    </div>

    <div class="join-modal" id="joinModal">
        <h3>🔒 Access Locked</h3>
        <p>File download karne ke liye channel aur group join karna zaroori hai!</p>
        <div id="joinLinksContainer"></div>
        <button class="join-check-btn" onclick="retryDownload()">✅ Joined, Try Again</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const BACKEND_URL = 'https://movie-zone-1bot.onrender.com';

        let allMovies = [];
        let appConfig = {};
        let currentPendingFile = null;
        let selectedCategory = 'all';
        let selectedYear = 'all';

        function setupYearDropdown() {
            const dropdown = document.getElementById('yearDropdown');
            const currentYear = 2026;
            for (let y = currentYear; y >= 1990; y--) {
                const opt = document.createElement('option');
                opt.value = y.toString();
                opt.innerText = y.toString();
                dropdown.appendChild(opt);
            }
        }
        setupYearDropdown();

        async function fetchAppConfig() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/config`);
                appConfig = await res.json();
                
                if (appConfig.powered_by) {
                    document.getElementById('poweredTag').innerText = appConfig.powered_by;
                }

                if (appConfig.btn_group) document.getElementById('btnDiscussion').href = appConfig.btn_group;
                if (appConfig.btn_backup) document.getElementById('btnBackup').href = appConfig.btn_backup;
                if (appConfig.btn_premium) document.getElementById('btnPremium').href = appConfig.btn_premium;
            } catch (err) {}
        }
        fetchAppConfig();

        async function fetchMovies() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/movies`);
                if (!res.ok) throw new Error('Network response was not ok');
                allMovies = await res.json();

                document.getElementById('headerMovieCount').innerHTML = `<i class="fas fa-film"></i> ${allMovies.length}`;
                renderFilteredMovies();
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('headerMovieCount').innerHTML = `<i class="fas fa-film"></i> 0`;
                document.getElementById('moviesContainer').innerHTML = '<div class="loader" style="color:#ff4e50"><i class="fas fa-exclamation-circle"></i> Error loading movies. Please check Backend!</div>';
            }
        }

        function renderFilteredMovies() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = allMovies.filter(m => {
                const titleLower = (m.title || '').toLowerCase();
                const matchesSearch = titleLower.includes(searchVal);
                const matchesCategory = (selectedCategory === 'all') || titleLower.includes(selectedCategory.toLowerCase());
                const matchesYear = (selectedYear === 'all') || titleLower.includes(selectedYear);
                return matchesSearch && matchesCategory && matchesYear;
            });

            renderMovies(filtered, searchVal);
        }

        function renderMovies(movies, searchVal = '') {
            const container = document.getElementById('moviesContainer');
            if (!movies || movies.length === 0) {
                container.innerHTML = `
                    <div class="no-result-box">
                        <i class="fas fa-film-slash"></i>
                        <h4>Movie Not Found</h4>
                        <p>Aapki dhoondhi gayi movie abhi available nahi hai.</p>
                        <button class="req-now-btn" onclick="submitInAppRequest('${searchVal}')">
                            <i class="fas fa-bullhorn"></i> Request "${searchVal || 'Movie'}"
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = movies.map((m, index) => {
                const fileCount = m.files ? m.files.length : 1;
                const posterUrl = m.thumbFileId ? `${BACKEND_URL}/api/thumb/${m.thumbFileId}` : 'https://i.ibb.co/23Vn7YBR/1786682242346.png';
                
                return `
                    <div class="movie-card">
                        <div class="poster-box">
                            <img src="${posterUrl}" alt="${m.title}" loading="lazy" onerror="this.src='https://i.ibb.co/23Vn7YBR/1786682242346.png'">
                            <span class="file-badge">${fileCount} Available</span>
                        </div>
                        <div class="card-details">
                            <h3 class="movie-title">${m.title}</h3>
                            <button class="get-btn" onclick="openSheetByIndex(${index})">
                                <i class="fas fa-arrow-alt-circle-down"></i> Get Files (${fileCount})
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openSheetByIndex(index) {
            const movie = allMovies[index];
            if (!movie) return;

            document.getElementById('sheetTitle').innerText = movie.title;
            const filesList = document.getElementById('filesList');
            
            filesList.innerHTML = (movie.files || []).map((f, fIndex) => `
                <div class="file-item">
                    <span class="file-label">${f.label}</span>
                    <button id="dlBtn_${index}_${fIndex}" class="dl-action-btn" onclick="handleDownloadByIndex(${index}, ${fIndex})">
                        <i class="fas fa-download"></i> Get File
                    </button>
                </div>
            `).join('');

            document.getElementById('sheetOverlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
        }

        function closeSheet() {
            document.getElementById('sheetOverlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
        }

        async function handleDownloadByIndex(movieIndex, fileIndex) {
            const movie = allMovies[movieIndex];
            const file = movie?.files?.[fileIndex];
            if (!movie || !file) return;

            const btn = document.getElementById(`dlBtn_${movieIndex}_${fileIndex}`);
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            }

            const fileId = file.fileId;
            const fileType = file.fileType || 'video';
            const movieTitle = movie.title;
            const label = file.label;

            if (appConfig.adgram_enabled && appConfig.adgram_block_id && window.AdController) {
                try {
                    window.AdController.show({
                        blockId: appConfig.adgram_block_id,
                        onComplete: () => { downloadFile(fileId, fileType, movieTitle, label, btn); },
                        onError: () => { downloadFile(fileId, fileType, movieTitle, label, btn); }
                    });
                    return;
                } catch (e) {
                    downloadFile(fileId, fileType, movieTitle, label, btn);
                    return;
                }
            }
            downloadFile(fileId, fileType, movieTitle, label, btn);
        }

        async function downloadFile(fileId, fileType, movieTitle, label, btn = null) {
            const chatId = tg?.initDataUnsafe?.user?.id;
            if (!chatId) {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> Get File'; }
                alert("Please open this app inside Telegram!");
                return;
            }

            currentPendingFile = { fileId, fileType, movieTitle, label };

            try {
                const res = await fetch(`${BACKEND_URL}/api/send-file`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileId, fileType, movieTitle, label, chatId })
                });

                const data = await res.json();

                if (res.status === 403 && data.forceSubRequired) {
                    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> Get File'; }
                    closeSheet();
                    showJoinModal(data.channel, data.group);
                    return;
                }

                if (data.success) {
                    if (btn) {
                        btn.style.background = '#00c853';
                        btn.innerHTML = '<i class="fas fa-check-circle"></i> Sent!';
                    }
                    setTimeout(() => {
                        closeSheet();
                        if (tg) tg.showPopup({ title: 'Success', message: 'File sent to your Telegram chat!' });
                    }, 800);
                } else {
                    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> Get File'; }
                }
            } catch (err) {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> Get File'; }
                alert("Error sending file: " + err.message);
            }
        }

        async function submitInAppRequest(movieName) {
            const user = tg?.initDataUnsafe?.user;
            if (!user) { alert("Please open inside Telegram to request!"); return; }

            const reqMovie = movieName || prompt("Enter Movie Name:");
            if (!reqMovie) return;

            try {
                const res = await fetch(`${BACKEND_URL}/api/request-movie`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: user.id,
                        username: user.username || user.first_name,
                        movieName: reqMovie
                    })
                });
                const data = await res.json();
                if (data.success) {
                    if (tg) tg.showPopup({ title: 'Request Sent', message: `Aapki "${reqMovie}" request Admin ko bhej di gayi hai!` });
                    else alert("Request Sent Successfully!");
                }
            } catch (e) {
                alert("Failed to submit request.");
            }
        }

        function showJoinModal(channel, group) {
            const container = document.getElementById('joinLinksContainer');
            container.innerHTML = '';
            if (channel) container.innerHTML += `<a href="https://t.me/${channel.replace('@','')}" target="_blank" class="join-link-btn">📢 Join Channel</a>`;
            if (group) container.innerHTML += `<a href="https://t.me/${group.replace('@','')}" target="_blank" class="join-link-btn" style="background:#ff0844">💬 Join Group</a>`;
            document.getElementById('joinModal').classList.add('active');
            document.getElementById('sheetOverlay').classList.add('active');
        }

        function retryDownload() {
            document.getElementById('joinModal').classList.remove('active');
            document.getElementById('sheetOverlay').classList.remove('active');
            if (currentPendingFile) {
                downloadFile(currentPendingFile.fileId, currentPendingFile.fileType, currentPendingFile.movieTitle, currentPendingFile.label);
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderFilteredMovies();
        });

        function handleYearChange(year) {
            selectedYear = year;
            renderFilteredMovies();
        }

        function applyCategoryFilter(cat, el) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedCategory = cat;
            renderFilteredMovies();
        }

        fetchMovies();
    </script>
</body>
</html>
