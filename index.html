<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Store</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h2 {
            text-align: center;
            color: #0088cc;
        }
        #loading {
            text-align: center;
            font-size: 18px;
            color: #aaaaaa;
            margin-top: 50px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .movie-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }
        .movie-title {
            font-size: 14px;
            margin-top: 8px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .send-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-top: 8px;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🎬 Movie Store</h2>
    <div id="loading">Loading movies...</div>
    <div class="movie-grid" id="movieGrid"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const BACKEND_URL = 'https://movie-zone-1bot.onrender.com';

        async function loadMovies() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/movies`);
                const movies = await response.json();

                const loadingDiv = document.getElementById('loading');
                const movieGrid = document.getElementById('movieGrid');

                loadingDiv.style.display = 'none';

                if (!movies || movies.length === 0) {
                    movieGrid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">कोई मूवी नहीं मिली!</p>';
                    return;
                }

                movieGrid.innerHTML = '';
                movies.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';

                    const thumbUrl = movie.thumbFileId 
                        ? `${BACKEND_URL}/api/thumb/${movie.thumbFileId}` 
                        : 'https://via.placeholder.com/150x200?text=No+Poster';

                    card.innerHTML = `
                        <img src="${thumbUrl}" alt="Poster" onerror="this.src='https://via.placeholder.com/150x200?text=No+Poster'">
                        <div class="movie-title" title="${movie.title}">${movie.title}</div>
                        <button class="send-btn" onclick="sendMovie('${movie._id}')">Get Movie</button>
                    `;
                    movieGrid.appendChild(card);
                });
            } catch (err) {
                document.getElementById('loading').innerText = 'मूवीज़ लोड करने में एरर आया!';
                console.error('Error fetching movies:', err);
            }
        }

        function sendMovie(movieId) {
            if (tg.sendData) {
                tg.sendData(movieId);
                tg.close();
            } else {
                alert("Telegram WebApp sendData support nahi कर रहा!");
            }
        }

        loadMovies();
    </script>
</body>
</html>
