<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Zone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff0844;
            --primary-gradient: linear-gradient(135deg, #ff0844 0%, #ff4e50 100%);
            --bg-dark: #0a0c10;
            --card-bg: #12161f;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #8b9bb4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* 🔝 BRAND HEADER */
        .app-header {
            padding: 16px 16px 12px;
            background: linear-gradient(180deg, rgba(255,8,68,0.12) 0%, rgba(10,12,16,0) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff0844;
            box-shadow: 0 0 12px rgba(255, 8, 68, 0.4);
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .powered-tag {
            font-size: 0.72rem;
            color: #ff4e50;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* 🔗 QUICK ACTION BUTTONS */
        .quick-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px 16px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .quick-btn.group { border-color: rgba(0, 136, 204, 0.3); color: #29b6f6; }
        .quick-btn.channel { border-color: rgba(255, 8, 68, 0.3); color: #ff5252; }

        /* 🔍 SEARCH & FILTERS */
        .search-wrapper {
            padding: 0 16px 12px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .search-input {
            width: 100%;
            background: #161b26;
            border: 1px solid var(--card-border);
            padding: 12px 14px 12px 42px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #ff0844;
        }

        .filter-scroll {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }

        .filter-chip {
            background: #161b26;
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-chip.active {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
        }

        /* 🎴 MOVIE CARDS SECTION */
        .movies-grid {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        .poster-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #1c2230;
            overflow: hidden;
        }

        .poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .file-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ff0844;
            color: #ff4e50;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        .card-details {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .movie-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
        }

        .get-btn {
            background: var(--primary-gradient);
            border: none;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 8, 68, 0.35);
        }

        /* 📱 BOTTOM SHEET POPUP */
        .sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: 0.3s ease;
        }

        .sheet-overlay.active {
            display: block;
            opacity: 1;
        }

        .bottom-sheet {
            position: fixed;
            left: 0; right: 0; bottom: -100%;
            background: #141822;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px 24px 0 0;
            padding: 20px 16px 30px;
            z-index: 101;
            transition: 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 75vh;
            display: flex;
            flex-direction: column;
        }

        .bottom-sheet.active {
            bottom: 0;
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 14px;
        }

        .sheet-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #fff;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .files-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            background: #1b212f;
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #e1e7f0;
        }

        .dl-action-btn {
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 🔒 JOIN POPUP */
        .join-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 360px;
            background: #161b26;
            border: 1px solid #ff0844;
            border-radius: 20px;
            padding: 24px 20px;
            z-index: 105;
            display: none;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .join-modal.active { display: block; transform: translate(-50%, -50%) scale(1); }
        .join-modal h3 { color: #ff4e50; margin-bottom: 8px; font-size: 1.15rem; }
        .join-modal p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px; }
        .join-link-btn {
            display: block;
            width: 100%;
            background: #29b6f6;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .join-check-btn {
            width: 100%;
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 🔝 BRAND HEADER -->
    <header class="app-header">
        <div class="brand-container">
            <img src="https://i.ibb.co/23Vn7YBR/1786682242346.png" alt="Movie Zone Logo" class="brand-logo">
            <div class="brand-text">
                <h1>Movie Zone</h1>
                <div class="powered-tag">Powered by @asumit669</div>
            </div>
        </div>
    </header>

    <!-- 🔗 QUICK LINKS -->
    <div class="quick-links">
        <a href="https://t.me/your_discussion_group" target="_blank" class="quick-btn group">
            <i class="fab fa-telegram-plane"></i> Discussion Group
        </a>
        <a href="https://t.me/your_backup_channel" target="_blank" class="quick-btn channel">
            <i class="fas fa-shield-alt"></i> Backup Channel
        </a>
    </div>

    <!-- 🔍 SEARCH BAR -->
    <div class="search-wrapper">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search movies, web series...">
        </div>
    </div>

    <!-- 🏷️ CATEGORY / YEAR CHIPS -->
    <div class="filter-scroll">
        <div class="filter-chip active" onclick="applyFilter('all', this)">All</div>
        <div class="filter-chip" onclick="applyFilter('2026', this)">2026</div>
        <div class="filter-chip" onclick="applyFilter('2025', this)">2025</div>
        <div class="filter-chip" onclick="applyFilter('2024', this)">2024</div>
        <div class="filter-chip" onclick="applyFilter('Hindi', this)">Hindi Dubbed</div>
        <div class="filter-chip" onclick="applyFilter('Web Series', this)">Web Series</div>
    </div>

    <!-- 🎴 MOVIE LIST CONTAINER -->
    <main class="movies-grid" id="moviesContainer">
        <div class="loader"><i class="fas fa-spinner fa-spin"></i> Loading Movies...</div>
    </main>

    <!-- 📱 BOTTOM SHEET POPUP -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="sheetTitle">Movie Title</div>
        <div class="files-list" id="filesList"></div>
    </div>

    <!-- 🔒 JOIN LOCK MODAL -->
    <div class="join-modal" id="joinModal">
        <h3>🔒 Access Locked</h3>
        <p>File download karne ke liye channel aur group join karna zaroori hai!</p>
        <div id="joinLinksContainer"></div>
        <button class="join-check-btn" onclick="retryDownload()">✅ Joined, Try Again</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // ✅ आपका Render Backend Link यहाँ परमानेंट सेट कर दिया गया है
        const BACKEND_URL = 'https://movie-zone-1bot.onrender.com';

        let allMovies = [];
        let currentPendingFile = null;

        async function fetchMovies() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/movies`);
                if (!res.ok) throw new Error('Network response was not ok');
                allMovies = await res.json();
                renderMovies(allMovies);
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('moviesContainer').innerHTML = '<div class="loader" style="color:#ff4e50"><i class="fas fa-exclamation-circle"></i> Error loading movies. Please check Backend!</div>';
            }
        }

        function renderMovies(movies) {
            const container = document.getElementById('moviesContainer');
            if (!movies || movies.length === 0) {
                container.innerHTML = '<div class="loader">No Movies Found</div>';
                return;
            }

            container.innerHTML = movies.map(m => {
                const fileCount = m.files ? m.files.length : 1;
                const posterUrl = m.thumbFileId ? `${BACKEND_URL}/api/thumb/${m.thumbFileId}` : 'https://i.ibb.co/23Vn7YBR/1786682242346.png';
                
                return `
                    <div class="movie-card">
                        <div class="poster-box">
                            <img src="${posterUrl}" alt="${m.title}" loading="lazy" onerror="this.src='https://i.ibb.co/23Vn7YBR/1786682242346.png'">
                            <span class="file-badge">${fileCount} Available</span>
                        </div>
                        <div class="card-details">
                            <h3 class="movie-title">${m.title}</h3>
                            <button class="get-btn" onclick='openSheet(${JSON.stringify(m).replace(/'/g, "&apos;")})'>
                                <i class="fas fa-arrow-alt-circle-down"></i> Get Files (${fileCount})
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openSheet(movie) {
            document.getElementById('sheetTitle').innerText = movie.title;
            const filesList = document.getElementById('filesList');
            
            filesList.innerHTML = movie.files.map(f => `
                <div class="file-item">
                    <span class="file-label">${f.label}</span>
                    <button class="dl-action-btn" onclick='downloadFile("${f.fileId}", "${f.fileType}", "${movie.title.replace(/'/g, "\\'")}", "${f.label}")'>
                        <i class="fas fa-download"></i> Get File
                    </button>
                </div>
            `).join('');

            document.getElementById('sheetOverlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
        }

        function closeSheet() {
            document.getElementById('sheetOverlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
        }

        async function downloadFile(fileId, fileType, movieTitle, label) {
            const chatId = tg?.initDataUnsafe?.user?.id;
            if (!chatId) {
                alert("Please open this app inside Telegram!");
                return;
            }

            currentPendingFile = { fileId, fileType, movieTitle, label };

            try {
                const res = await fetch(`${BACKEND_URL}/api/send-file`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileId, fileType, movieTitle, label, chatId })
                });

                const data = await res.json();

                if (res.status === 403 && data.forceSubRequired) {
                    closeSheet();
                    showJoinModal(data.channel, data.group);
                    return;
                }

                if (data.success) {
                    closeSheet();
                    if (tg) tg.showPopup({ title: 'Success', message: 'File sent to your Telegram chat!' });
                }
            } catch (err) {
                alert("Error sending file: " + err.message);
            }
        }

        function showJoinModal(channel, group) {
            const container = document.getElementById('joinLinksContainer');
            container.innerHTML = '';
            if (channel) container.innerHTML += `<a href="https://t.me/${channel.replace('@','')}" target="_blank" class="join-link-btn">📢 Join Channel</a>`;
            if (group) container.innerHTML += `<a href="https://t.me/${group.replace('@','')}" target="_blank" class="join-link-btn" style="background:#ff0844">💬 Join Group</a>`;
            document.getElementById('joinModal').classList.add('active');
            document.getElementById('sheetOverlay').classList.add('active');
        }

        function retryDownload() {
            document.getElementById('joinModal').classList.remove('active');
            document.getElementById('sheetOverlay').classList.remove('active');
            if (currentPendingFile) {
                downloadFile(currentPendingFile.fileId, currentPendingFile.fileType, currentPendingFile.movieTitle, currentPendingFile.label);
            }
        }

        // Live Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            const filtered = allMovies.filter(m => m.title.toLowerCase().includes(q));
            renderMovies(filtered);
        });

        // Filter Chips
        function applyFilter(tag, el) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            if (tag === 'all') {
                renderMovies(allMovies);
            } else {
                const filtered = allMovies.filter(m => m.title.toLowerCase().includes(tag.toLowerCase()));
                renderMovies(filtered);
            }
        }

        fetchMovies();
    </script>
</body>
</html>
