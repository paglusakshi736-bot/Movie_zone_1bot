<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Zone Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0b0c10; color: #ffffff; padding: 14px; padding-bottom: 90px; }

        /* HEADER & LOGO */
        .top-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-box i { font-size: 26px; color: #e50914; }
        .logo-box h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; background: linear-gradient(45deg, #ff4b2b, #ff416c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* QUICK ACTION BUTTONS */
        .quick-links { display: flex; gap: 10px; margin-bottom: 15px; }
        .q-btn { flex: 1; padding: 9px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid rgba(255,255,255,0.08); }
        .btn-discuss { background: #1f293d; color: #38bdf8; }
        .btn-backup { background: #2a1f3d; color: #c084fc; }

        /* SEARCH BAR */
        .search-container { position: relative; margin-bottom: 15px; }
        .search-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6b7280; }
        .search-container input { width: 100%; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1px solid #1f2937; background: #161b22; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .search-container input:focus { border-color: #ff416c; }

        /* CATEGORIES & YEAR FILTERS */
        .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-chip { padding: 6px 14px; background: #161b22; border-radius: 20px; font-size: 12px; font-weight: 600; color: #9ca3af; white-space: nowrap; border: 1px solid #21262d; cursor: pointer; }
        .filter-chip.active { background: linear-gradient(45deg, #ff4b2b, #ff416c); color: #fff; border-color: transparent; }

        /* SINGLE BIG CARD LAYOUT (1 COLUMN) */
        .movie-list { display: flex; flex-direction: column; gap: 16px; }
        .big-card { background: #161b22; border-radius: 16px; overflow: hidden; border: 1px solid #21262d; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .poster-box { width: 100%; height: 200px; position: relative; background: #0d1117; overflow: hidden; }
        .poster { width: 100%; height: 100%; object-fit: cover; }
        .poster-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #161b22 10%, transparent 60%); }
        .badge-count { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.8); color: #ff4b2b; font-size: 11px; padding: 4px 10px; border-radius: 8px; font-weight: 700; border: 1px solid rgba(255,75,43,0.4); backdrop-filter: blur(4px); }

        .card-body { padding: 14px; margin-top: -20px; position: relative; z-index: 2; }
        .card-title { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; color: #ffffff; }
        .btn-get { width: 100%; background: linear-gradient(45deg, #ff4b2b, #ff416c); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(255, 65, 108, 0.3); }

        /* BOTTOM POPUP MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: flex-end; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-sheet { background: #161b22; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; border-top: 1px solid #30363d; animation: slideUp 0.25s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #21262d; padding-bottom: 12px; }
        .modal-title { font-size: 15px; font-weight: 700; color: #fff; }
        .close-btn { background: #21262d; border: none; color: #9ca3af; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }

        .quality-item { display: flex; align-items: center; justify-content: space-between; background: #0d1117; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #21262d; }
        .quality-label { font-size: 13px; font-weight: 600; color: #e5e7eb; display: flex; align-items: center; gap: 6px; }
        .btn-download { background: #238636; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

        /* FORCE SUB BOX */
        .forcesub-box { text-align: center; padding: 15px 0; }
        .forcesub-box p { font-size: 13px; color: #fca5a5; margin-bottom: 15px; line-height: 1.4; }
        .join-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: #0284c7; color: white; padding: 11px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- TOP LOGO -->
    <div class="top-nav">
        <div class="logo-box">
            <i class="fa-solid fa-clapperboard"></i>
            <h1>MOVIE ZONE</h1>
        </div>
    </div>

    <!-- DISCUSSION & BACKUP CHANNELS -->
    <div class="quick-links">
        <a href="https://t.me/YOUR_DISCUSSION_LINK" target="_blank" class="q-btn btn-discuss">
            <i class="fa-solid fa-comments"></i> Discussion Group
        </a>
        <a href="https://t.me/YOUR_BACKUP_CHANNEL" target="_blank" class="q-btn btn-backup">
            <i class="fa-solid fa-shield-halved"></i> Backup Channel
        </a>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="मूवी या वेब सीरीज़ सर्च करें..." oninput="applyFilters()">
    </div>

    <!-- CATEGORY & YEAR FILTERS -->
    <div class="filter-scroll" id="categoryFilters">
        <div class="filter-chip active" onclick="setFilter(this, 'all')">All</div>
        <div class="filter-chip" onclick="setFilter(this, '2026')">2026</div>
        <div class="filter-chip" onclick="setFilter(this, '2025')">2025</div>
        <div class="filter-chip" onclick="setFilter(this, '2024')">2024</div>
        <div class="filter-chip" onclick="setFilter(this, 'Hindi')">Hindi Dubbed</div>
        <div class="filter-chip" onclick="setFilter(this, 'Web Series')">Web Series</div>
        <div class="filter-chip" onclick="setFilter(this, 'South')">South Special</div>
    </div>

    <!-- SINGLE BIG CARDS LIST -->
    <div class="movie-list" id="movieList">
        <p style="text-align: center; color: #6b7280; padding: 20px;">मूवीज़ लोड हो रही हैं...</p>
    </div>

    <!-- QUALITY POPUP MODAL -->
    <div class="modal-overlay" id="qualityModal" onclick="closeModal(event)">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title" id="modalMovieTitle">क्वालिटी चुनें</span>
                <button class="close-btn" onclick="hideModal()">✕</button>
            </div>
            <div id="qualityList"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const BACKEND_URL = 'https://movie-zone-1bot.onrender.com';
        let allMovies = [];
        let currentFilter = 'all';
        const chatId = tg?.initDataUnsafe?.user?.id || new URLSearchParams(window.location.search).get('chat_id');

        async function fetchMovies() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/movies`);
                allMovies = await res.json();
                applyFilters();
            } catch (err) {
                document.getElementById('movieList').innerHTML = '<p style="text-align: center; color: #ef4444; padding: 20px;">डेटा लोड करने में समस्या हुई।</p>';
            }
        }

        function setFilter(el, filter) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentFilter = filter;
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allMovies;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(m => m.title.toLowerCase().includes(currentFilter.toLowerCase()));
            }

            if (query) {
                filtered = filtered.filter(m => m.title.toLowerCase().includes(query));
            }

            renderMovies(filtered);
        }

        function renderMovies(movies) {
            const container = document.getElementById('movieList');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 20px;">कोई मूवी नहीं मिली।</p>';
                return;
            }

            movies.forEach(movie => {
                const posterUrl = movie.thumbFileId 
                    ? `${BACKEND_URL}/api/thumb/${movie.thumbFileId}` 
                    : 'https://via.placeholder.com/600x300/161b22/ffffff?text=No+Poster';

                const totalVersions = movie.files ? movie.files.length : 1;

                const card = document.createElement('div');
                card.className = 'big-card';
                card.innerHTML = `
                    <div class="poster-box">
                        <img class="poster" src="${posterUrl}" onerror="this.src='https://via.placeholder.com/600x300/161b22/ffffff?text=Poster'">
                        <div class="poster-overlay"></div>
                        <span class="badge-count">${totalVersions} Available</span>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${movie.title}</div>
                        <button class="btn-get" onclick='openModal(${JSON.stringify(movie).replace(/'/g, "&apos;")})'>
                            <i class="fa-solid fa-circle-arrow-down"></i> Get Files (${totalVersions})
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(movie) {
            document.getElementById('modalMovieTitle').innerText = movie.title;
            const qualityList = document.getElementById('qualityList');
            qualityList.innerHTML = '';

            (movie.files || []).forEach(f => {
                const item = document.createElement('div');
                item.className = 'quality-item';
                item.innerHTML = `
                    <span class="quality-label"><i class="fa-solid fa-film" style="color:#ff4b2b;"></i> ${f.label}</span>
                    <button class="btn-download" onclick="requestMovie('${f.fileId}', '${f.fileType}', '${movie.title.replace(/'/g, "\\'")}', '${f.label.replace(/'/g, "\\'")}', this)">Get File</button>
                `;
                qualityList.appendChild(item);
            });

            document.getElementById('qualityModal').style.display = 'flex';
        }

        function hideModal() { document.getElementById('qualityModal').style.display = 'none'; }
        function closeModal(e) { if (e.target.id === 'qualityModal') hideModal(); }

        async function requestMovie(fileId, fileType, movieTitle, label, btn) {
            if (!chatId) {
                alert('कृपया बॉट के अंदर से ऐप खोलें!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'चेक हो रहा है...';

            try {
                const res = await fetch(`${BACKEND_URL}/api/send-file`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileId, fileType, movieTitle, label, chatId })
                });

                const data = await res.json();

                if (res.status === 403 && data.forceSubRequired) {
                    document.getElementById('modalMovieTitle').innerText = '🔒 जॉइन करना ज़रूरी है';
                    let html = '<div class="forcesub-box"><p>मूवी डाउनलोड करने के लिए कृपया हमारे चैनल व ग्रुप को जॉइन करें:</p>';
                    if (data.channel) {
                        const link = data.channel.startsWith('@') ? `https://t.me/${data.channel.replace('@','')}` : data.channel;
                        html += `<a href="${link}" target="_blank" class="join-btn"><i class="fa-brands fa-telegram"></i> चैनल जॉइन करें</a>`;
                    }
                    if (data.group) {
                        const link = data.group.startsWith('@') ? `https://t.me/${data.group.replace('@','')}` : data.group;
                        html += `<a href="${link}" target="_blank" class="join-btn"><i class="fa-solid fa-comments"></i> ग्रुप जॉइन करें</a>`;
                    }
                    html += '</div>';
                    document.getElementById('qualityList').innerHTML = html;
                    return;
                }

                if (res.ok) {
                    btn.innerText = '✅ सेंड हो गई';
                    if (tg?.showAlert) tg.showAlert('फ़ाइल आपकी चैट में भेज दी गई है!');
                    setTimeout(() => hideModal(), 1200);
                } else {
                    btn.innerText = '❌ एरर';
                    btn.disabled = false;
                }
            } catch (err) {
                btn.innerText = '❌ एरर';
                btn.disabled = false;
            }
        }

        fetchMovies();
    </script>
</body>
</html>
