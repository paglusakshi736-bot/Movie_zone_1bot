<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Zone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f1016; color: #ffffff; padding: 16px; padding-bottom: 80px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #ff334b; }
        .search-box { width: 100%; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #282a36; background: #1a1b26; color: #fff; font-size: 14px; outline: none; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .card { background: #1a1b26; border-radius: 14px; overflow: hidden; border: 1px solid #282a36; display: flex; flex-direction: column; }
        .card:active { transform: scale(0.98); }
        .poster { width: 100%; height: 210px; object-fit: cover; background: #13141f; }
        .card-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; color: #f0f0f0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .badge { display: inline-block; background: rgba(255, 51, 75, 0.15); color: #ff334b; font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; margin-bottom: 8px; }
        .btn-view { width: 100%; background: #ff334b; color: #fff; border: none; padding: 9px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }

        /* BOTTOM MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-sheet { background: #1a1b26; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #282a36; padding-bottom: 10px; }
        .modal-title { font-size: 15px; font-weight: 700; color: #fff; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }

        .quality-item { display: flex; align-items: center; justify-content: space-between; background: #222433; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; }
        .quality-label { font-size: 13px; font-weight: 600; color: #e1e1e1; }
        .btn-download { background: #22c55e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-download:disabled { background: #555; }

        /* FORCE SUB BOX */
        .forcesub-box { text-align: center; padding: 10px 0; }
        .forcesub-box p { font-size: 14px; color: #ffb86c; margin-bottom: 14px; }
        .join-btn { display: block; width: 100%; background: #0088cc; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍿 Movie Zone</h1>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="मूवी या वेब सीरीज़ खोजें..." oninput="searchMovies()">
    </div>

    <div class="grid" id="movieGrid">
        <p style="grid-column: span 2; text-align: center; color: #888;">मूवीज़ लोड हो रही हैं...</p>
    </div>

    <!-- QUALITY & FORCESUB MODAL -->
    <div class="modal-overlay" id="qualityModal" onclick="closeModal(event)">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title" id="modalMovieTitle">क्वालिटी चुनें</span>
                <button class="close-btn" onclick="hideModal()">✕</button>
            </div>
            <div id="qualityList"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const BACKEND_URL = 'https://movie-zone-1bot.onrender.com';
        let allMovies = [];
        const chatId = tg?.initDataUnsafe?.user?.id || new URLSearchParams(window.location.search).get('chat_id');

        async function fetchMovies() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/movies`);
                allMovies = await res.json();
                renderMovies(allMovies);
            } catch (err) {
                document.getElementById('movieGrid').innerHTML = '<p style="grid-column: span 2; text-align: center; color: red;">मूवीज लोड नहीं हो पाईं।</p>';
            }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            if (movies.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #888;">कोई मूवी नहीं मिली।</p>';
                return;
            }

            movies.forEach(movie => {
                const posterUrl = movie.thumbFileId 
                    ? `${BACKEND_URL}/api/thumb/${movie.thumbFileId}` 
                    : 'https://via.placeholder.com/300x450/1a1b26/ffffff?text=No+Poster';

                const totalVersions = movie.files ? movie.files.length : 1;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img class="poster" src="${posterUrl}" onerror="this.src='https://via.placeholder.com/300x450/1a1b26/ffffff?text=Poster'">
                    <div class="card-body">
                        <div>
                            <span class="badge">${totalVersions} Option${totalVersions > 1 ? 's' : ''}</span>
                            <div class="card-title">${movie.title}</div>
                        </div>
                        <button class="btn-view" onclick='openModal(${JSON.stringify(movie).replace(/'/g, "&apos;")})'>Get Movie</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(movie) {
            document.getElementById('modalMovieTitle').innerText = movie.title;
            const qualityList = document.getElementById('qualityList');
            qualityList.innerHTML = '';

            (movie.files || []).forEach(f => {
                const item = document.createElement('div');
                item.className = 'quality-item';
                item.innerHTML = `
                    <span class="quality-label">📦 ${f.label}</span>
                    <button class="btn-download" onclick="requestMovie('${f.fileId}', '${f.fileType}', '${movie.title.replace(/'/g, "\\'")}', '${f.label.replace(/'/g, "\\'")}', this)">Get File</button>
                `;
                qualityList.appendChild(item);
            });

            document.getElementById('qualityModal').style.display = 'flex';
        }

        function hideModal() { document.getElementById('qualityModal').style.display = 'none'; }
        function closeModal(e) { if (e.target.id === 'qualityModal') hideModal(); }

        async function requestMovie(fileId, fileType, movieTitle, label, btn) {
            if (!chatId) {
                alert('कृपया बॉट के अंदर से ऐप खोलें!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'चेक हो रहा है...';

            try {
                const res = await fetch(`${BACKEND_URL}/api/send-file`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileId, fileType, movieTitle, label, chatId })
                });

                const data = await res.json();

                if (res.status === 403 && data.forceSubRequired) {
                    // Show Force Subscribe Popup
                    document.getElementById('modalMovieTitle').innerText = '🔒 जॉइन करना ज़रूरी है';
                    let html = '<div class="forcesub-box"><p>मूवी पाने के लिए हमारे चैनल और ग्रुप को जॉइन करें:</p>';
                    if (data.channel) {
                        const link = data.channel.startsWith('@') ? `https://t.me/${data.channel.replace('@','')}` : data.channel;
                        html += `<a href="${link}" target="_blank" class="join-btn">📢 चैनल जॉइन करें</a>`;
                    }
                    if (data.group) {
                        const link = data.group.startsWith('@') ? `https://t.me/${data.group.replace('@','')}` : data.group;
                        html += `<a href="${link}" target="_blank" class="join-btn">💬 ग्रुप जॉइन करें</a>`;
                    }
                    html += '</div>';
                    document.getElementById('qualityList').innerHTML = html;
                    return;
                }

                if (res.ok) {
                    btn.innerText = '✅ सेंड हो गई';
                    if (tg?.showAlert) tg.showAlert('फ़ाइल आपकी चैट में भेज दी गई है!');
                    setTimeout(() => hideModal(), 1200);
                } else {
                    btn.innerText = '❌ एरर';
                    btn.disabled = false;
                }
            } catch (err) {
                btn.innerText = '❌ एरर';
                btn.disabled = false;
            }
        }

        function searchMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query));
            renderMovies(filtered);
        }

        fetchMovies();
    </script>
</body>
</html>
